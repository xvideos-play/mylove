
<!DOCTYPE html>

  <meta charset="UTF-8">

  <title>Play Best Vide</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #111111;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 12px 30px;
    }

    /* Logo / Title */
    .logo {
      text-align: center;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -2px;
      margin: 10px 0 5px;
      background: linear-gradient(90deg, #1769ff, #7b2cff, #ff2775);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 15px;
      margin-bottom: 22px;
    }

    /* Image Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .card {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 1 / 0.78;
      overflow: hidden;
      border-radius: 14px;
      text-decoration: none;
      background: #eee;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
      -webkit-tap-highlight-color: transparent;
    }

    .card img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    /* Dark gradient over image */
    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.65),
        rgba(0, 0, 0, 0.05) 65%
      );
    }

    .card-content {
      position: absolute;
      z-index: 2;
      left: 14px;
      right: 14px;
      bottom: 13px;
      color: white;
    }

    .card-title {
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 8px;
      text-shadow: 0 1px 4px rgba(0,0,0,.4);
    }

    .arrow {
      width: 34px;
      height: 34px;
      border: 1.5px solid rgba(255,255,255,.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    /* Desktop */
    @media (min-width: 700px) {
      .container {
        padding: 35px 20px 50px;
      }

      .logo {
        font-size: 48px;
      }

      .subtitle {
        font-size: 17px;
        margin-bottom: 30px;
      }

      .grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }

      .card {
        aspect-ratio: 1 / 0.82;
      }

      .card:hover img {
        transform: scale(1.05);
      }

      .card-title {
        font-size: 22px;
      }
    }

    /* Small phones */
    @media (max-width: 380px) {
      .container {
        padding-left: 9px;
        padding-right: 9px;
      }

      .grid {
        gap: 9px;
      }

      .card {
        border-radius: 11px;
      }

      .card-content {
        left: 10px;
        right: 10px;
        bottom: 10px;
      }

      .card-title {
        font-size: 17px;
      }

      .arrow {
        width: 29px;
        height: 29px;
        font-size: 17px;
      }
    }
  </style>
</head>
