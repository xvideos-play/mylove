<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0c0f14" />
  <title>Image Gallery</title>
  <style>
    :root {
      --bg: #0c0f14;
      --surface: #141820;
      --surface-soft: #1b202a;
      --line: rgba(255,255,255,.11);
      --text: #f8f8fb;
      --muted: #8e95a3;
      --violet: #8b5cf6;
      --violet-light: #a78bfa;
    }

    * { box-sizing: border-box; }

    html { background: var(--bg); }

    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(circle at 50% -10%, rgba(139,92,246,.12), transparent 32rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a { color: inherit; }

    .app {
      width: min(100%, 680px);
      min-height: 100svh;
      margin: 0 auto;
      padding: 16px 16px 92px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 48px;
      margin-bottom: 18px;
    }

    .brand-mark {
      position: relative;
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 6px solid var(--violet);
      border-right-color: transparent;
      border-radius: 50%;
      transform: rotate(-38deg);
      box-shadow: 0 0 20px rgba(139,92,246,.24);
    }

    .top-actions { display: flex; gap: 10px; }

    .icon-button,
    .nav-item {
      display: grid;
      place-items: center;
      border: 0;
      color: var(--muted);
      background: transparent;
    }

    .icon-button {
      width: 40px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 50%;
      cursor: pointer;
    }

    .icon-button:hover,
    .icon-button:focus-visible { color: var(--text); border-color: var(--violet); }

    .gallery {
      display: grid;
      gap: 18px;
    }

    /* Edit each card's href to use a different custom destination URL. */
    .image-card {
      position: relative;
      display: block;
      overflow: hidden;
      aspect-ratio: 4 / 5;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--surface);
      text-decoration: none;
      isolation: isolate;
      box-shadow: 0 16px 40px rgba(0,0,0,.22);
      transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    }

    .image-card:hover,
    .image-card:focus-visible {
      transform: translateY(-3px);
      border-color: rgba(167,139,250,.8);
      box-shadow: 0 20px 46px rgba(0,0,0,.34), 0 0 0 3px rgba(139,92,246,.12);
      outline: none;
    }

    .image-card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .45s ease, filter .45s ease;
    }

    .image-card:hover img,
    .image-card:focus-visible img {
      transform: scale(1.035);
      filter: saturate(1.06);
    }

    .image-card::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(0,0,0,.12), transparent 34%, rgba(0,0,0,.18));
    }

    .play-button {
      position: absolute;
      z-index: 2;
      top: 50%;
      left: 50%;
      display: grid;
      place-items: center;
      width: 66px;
      height: 66px;
      padding: 0;
      border: 1px solid rgba(255,255,255,.48);
      border-radius: 50%;
      color: #fff;
      background: rgba(12,15,20,.62);
      backdrop-filter: blur(12px);
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }

    .play-button svg { width: 25px; height: 25px; margin-left: 4px; fill: currentColor; }

    .bottom-nav {
      position: fixed;
      z-index: 10;
      right: 16px;
      bottom: 14px;
      left: 16px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      width: min(calc(100% - 32px), 648px);
      margin: auto;
      padding: 9px 8px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(20,24,32,.86);
      backdrop-filter: blur(18px);
      box-shadow: 0 12px 34px rgba(0,0,0,.35);
    }

    .nav-item {
      min-height: 40px;
      border-radius: 14px;
      cursor: pointer;
      transition: color .2s ease, background .2s ease;
    }

    .nav-item:hover,
    .nav-item:focus-visible,
    .nav-item.active {
      color: #fff;
      background: rgba(139,92,246,.2);
      outline: none;
    }

    .nav-item svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.8; }

    @media (min-width: 700px) {
      .app { padding-top: 24px; }
      .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
      .bottom-nav { left: 50%; right: auto; transform: translateX(-50%); }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar" aria-label="Gallery header">
      <a class="brand-mark" href="#top" aria-label="Home"></a>
      <div class="top-actions">
        <button class="icon-button" type="button" aria-label="Search">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 5 5"/></svg>
        </button>
        <button class="icon-button" type="button" aria-label="Profile">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.4 3.2-5.1 7-5.1s6.2 1.7 7 5.1"/></svg>
        </button>
      </div>
    </header>

    <section class="gallery" id="top" aria-label="Image gallery">
      <!-- Replace each href with the custom external destination for that image. -->
      <a class="image-card" href="https://example.com/collection-one" target="_blank" rel="noopener noreferrer" aria-label="Open collection one">
        <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1200&q=85" alt="Mountain landscape at sunset" loading="eager" />
        <span class="play-button" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8.5 5.8a1 1 0 0 1 1.55-.84l7.1 5.2a1 1 0 0 1 0 1.68l-7.1 5.2a1 1 0 0 1-1.55-.84V5.8Z"/></svg></span>
      </a>

      <a class="image-card" href="https://example.com/collection-two" target="_blank" rel="noopener noreferrer" aria-label="Open collection two">
        <img src="https://images.unsplash.com/photo-1531058020387-3be344556be6?auto=format&fit=crop&w=1200&q=85" alt="Modern architecture with curved lines" loading="lazy" />
        <span class="play-button" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8.5 5.8a1 1 0 0 1 1.55-.84l7.1 5.2a1 1 0 0 1 0 1.68l-7.1 5.2a1 1 0 0 1-1.55-.84V5.8Z"/></svg></span>
      </a>

      <a class="image-card" href="https://example.com/collection-three" target="_blank" rel="noopener noreferrer" aria-label="Open collection three">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=1200&q=85" alt="Portrait in warm natural light" loading="lazy" />
        <span class="play-button" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8.5 5.8a1 1 0 0 1 1.55-.84l7.1 5.2a1 1 0 0 1 0 1.68l-7.1 5.2a1 1 0 0 1-1.55-.84V5.8Z"/></svg></span>
      </a>

      <a class="image-card" href="https://example.com/collection-four" target="_blank" rel="noopener noreferrer" aria-label="Open collection four">
        <img src="https://images.unsplash.com/photo-1518005020951-eccb494ad742?auto=format&fit=crop&w=1200&q=85" alt="Abstract red and orange rock formations" loading="lazy" />
        <span class="play-button" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8.5 5.8a1 1 0 0 1 1.55-.84l7.1 5.2a1 1 0 0 1 0 1.68l-7.1 5.2a1 1 0 0 1-1.55-.84V5.8Z"/></svg></span>
      </a>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-item active" type="button" aria-label="Home">
      <svg viewBox="0 0 24 24"><path d="m4 10 8-6 8 6v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1v-9Z"/></svg>
    </button>
    <button class="nav-item" type="button" aria-label="Explore">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 5 5"/></svg>
    </button>
    <button class="nav-item" type="button" aria-label="Collections">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
    </button>
    <button class="nav-item" type="button" aria-label="Saved">
      <svg viewBox="0 0 24 24"><path d="M6 5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16l-6-3-6 3V5Z"/></svg>
    </button>
  </nav>
</body>
</html>
